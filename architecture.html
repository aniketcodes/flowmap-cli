<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowMap Agent — Architecture</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #fff;
            color: #1d1d1f;
            padding: 48px 32px;
        }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .subtitle { font-size: 14px; color: #86868b; margin-bottom: 40px; }
    </style>
</head>
<body>
    <h1>FlowMap Agent — Architecture</h1>
    <p class="subtitle">Slack → Agent → MCP Servers → Data Sources</p>

    <svg viewBox="0 0 900 520" width="100%" style="font-family: 'Inter', -apple-system, sans-serif;">
        <defs>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                <path d="M0,0 L8,3 L0,6 Z" fill="#1d1d1f"/>
            </marker>
        </defs>

        <!-- Layer 1: Slack -->
        <rect x="350" y="20" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#a8c7fa" stroke-width="1.5"/>
        <text x="450" y="47" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">Slack Workspace</text>
        <line x1="450" y1="64" x2="450" y2="80" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- Layer 2: Agent -->
        <rect x="250" y="84" width="400" height="70" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
        <text x="266" y="102" font-size="10" font-weight="600" fill="#86868b" letter-spacing="0.8">FLOWMAP AGENT</text>
        <rect x="270" y="110" width="80" height="28" rx="5" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1"/>
        <text x="310" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#137333">SlackBot</text>
        <rect x="362" y="110" width="80" height="28" rx="5" fill="#fef7e0" stroke="#fcd34d" stroke-width="1"/>
        <text x="402" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">Agent</text>
        <rect x="454" y="110" width="80" height="28" rx="5" fill="#fce8e6" stroke="#f5a8a0" stroke-width="1"/>
        <text x="494" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#d93025">LLM</text>
        <rect x="546" y="110" width="80" height="28" rx="5" fill="#f3e8fd" stroke="#c084fc" stroke-width="1"/>
        <text x="586" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">TDD PR</text>

        <!-- Layer 3: MCP Servers (3 equal columns) -->
        <!-- FlowMap -->
        <line x1="310" y1="154" x2="180" y2="180" stroke="#1d1d1f" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="80" y="184" width="220" height="80" rx="8" fill="#f3e8fd" stroke="#c084fc" stroke-width="1.5"/>
        <text x="190" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">FlowMap MCP</text>
        <text x="190" y="222" text-anchor="middle" font-size="10" fill="#86868b">tree-sitter + LanceDB + Ollama</text>
        <text x="190" y="240" text-anchor="middle" font-size="9" fill="#7c3aed" font-family="monospace">search · cat · history · repos</text>
        <text x="190" y="256" text-anchor="middle" font-size="8" fill="#86868b">SSE :3001</text>

        <!-- Grafana -->
        <line x1="402" y1="154" x2="450" y2="180" stroke="#1d1d1f" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="340" y="184" width="220" height="80" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
        <text x="450" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">Grafana MCP</text>
        <text x="450" y="222" text-anchor="middle" font-size="10" fill="#86868b">mcp-grafana (stdio)</text>
        <text x="450" y="240" text-anchor="middle" font-size="9" fill="#dc2626" font-family="monospace">loki · prometheus · datasources</text>
        <text x="450" y="256" text-anchor="middle" font-size="8" fill="#86868b">JSON-RPC 2.0</text>

        <!-- Slack MCP -->
        <line x1="586" y1="154" x2="720" y2="180" stroke="#1d1d1f" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="600" y="184" width="220" height="80" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
        <text x="710" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5">Slack MCP</text>
        <text x="710" y="222" text-anchor="middle" font-size="10" fill="#86868b">slack-mcp-server</text>
        <text x="710" y="240" text-anchor="middle" font-size="9" fill="#4f46e5" font-family="monospace">history · replies · users</text>
        <text x="710" y="256" text-anchor="middle" font-size="8" fill="#86868b">SSE :13080</text>

        <!-- Layer 4: Data Sources -->
        <line x1="190" y1="264" x2="190" y2="300" stroke="#1d1d1f" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="450" y1="264" x2="450" y2="300" stroke="#1d1d1f" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="710" y1="264" x2="710" y2="300" stroke="#1d1d1f" stroke-width="1" marker-end="url(#arrow)"/>

        <rect x="80" y="304" width="220" height="44" rx="6" fill="#f3e8fd" stroke="#c084fc" stroke-width="1"/>
        <text x="190" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Code Repos</text>
        <text x="190" y="340" text-anchor="middle" font-size="9" fill="#86868b">8 repos · Python, TS, Go, Java</text>

        <rect x="340" y="304" width="220" height="44" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="450" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Grafana Stack</text>
        <text x="450" y="340" text-anchor="middle" font-size="9" fill="#86868b">Loki · Prometheus · Tempo · OTel</text>

        <rect x="600" y="304" width="220" height="44" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
        <text x="710" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">Slack API</text>
        <text x="710" y="340" text-anchor="middle" font-size="9" fill="#86868b">conversations · users · channels</text>

        <!-- Layer 5: Demo Services + GitHub -->
        <line x1="450" y1="348" x2="450" y2="380" stroke="#1d1d1f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="466" y="370" font-size="8" fill="#86868b">logs, metrics, traces</text>

        <rect x="250" y="384" width="500" height="54" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
        <text x="266" y="402" font-size="10" font-weight="600" fill="#86868b" letter-spacing="0.8">DEMO MICROSERVICES</text>
        <rect x="270" y="410" width="130" height="22" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1"/>
        <text x="335" y="425" text-anchor="middle" font-size="9" font-weight="500" fill="#137333">payment (Python)</text>
        <rect x="415" y="410" width="130" height="22" rx="4" fill="#fef7e0" stroke="#fcd34d" stroke-width="1"/>
        <text x="480" y="425" text-anchor="middle" font-size="9" font-weight="500" fill="#b45309">order (TypeScript)</text>
        <rect x="560" y="410" width="130" height="22" rx="4" fill="#fce8e6" stroke="#f5a8a0" stroke-width="1"/>
        <text x="625" y="425" text-anchor="middle" font-size="9" font-weight="500" fill="#d93025">ledger (Go)</text>

        <!-- GitHub -->
        <rect x="80" y="392" width="130" height="36" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
        <text x="145" y="415" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">GitHub</text>

        <!-- Legend -->
        <rect x="80" y="464" width="670" height="24" rx="4" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="0.5"/>
        <line x1="100" y1="476" x2="120" y2="476" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="130" y="480" font-size="9" fill="#86868b">request</text>
        <line x1="200" y1="476" x2="220" y2="476" stroke="#1d1d1f" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="230" y="480" font-size="9" fill="#86868b">async</text>
        <rect x="290" y="469" width="8" height="14" rx="2" fill="#7c3aed" opacity="0.3"/>
        <text x="306" y="480" font-size="9" fill="#86868b">code intelligence</text>
        <rect x="410" y="469" width="8" height="14" rx="2" fill="#dc2626" opacity="0.3"/>
        <text x="426" y="480" font-size="9" fill="#86868b">observability</text>
        <rect x="520" y="469" width="8" height="14" rx="2" fill="#4f46e5" opacity="0.3"/>
        <text x="536" y="480" font-size="9" fill="#86868b">slack context</text>
    </svg>
</body>
</html>
