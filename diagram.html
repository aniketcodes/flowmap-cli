<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowMap Agent — Sequence Diagram</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #fff;
            color: #1d1d1f;
        }

        .header {
            padding: 32px 32px 0;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 16px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 32px;
            background: #f5f5f7;
            border-bottom: 1px solid #d2d2d7;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .controls button {
            width: 32px;
            height: 32px;
            border: 1px solid #d2d2d7;
            border-radius: 6px;
            background: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
        }

        .controls button:hover {
            background: #e8e8ed;
        }

        .controls .zoom-label {
            font-size: 13px;
            color: #86868b;
            min-width: 50px;
            text-align: center;
        }

        .controls .hint {
            font-size: 12px;
            color: #86868b;
            margin-left: auto;
        }

        .diagram-wrapper {
            overflow: auto;
            padding: 24px 32px 48px;
        }

        .diagram-inner {
            transform-origin: top left;
            transition: transform 0.15s ease;
        }
    </style>
</head>
<body>
    <div class="header">

        <p class="subtitle">End-to-end sequence: Slack question → Agent loop → TDD Bugfix PR</p>
    </div>

    <div class="diagram-wrapper">

                <!-- Participant boxes -->

                <rect x="425" y="12" width="72" height="32" rx="6" fill="#fce8e6" stroke="#f5a8a0" stroke-width="1.5"/>

    </div>

    <script>
        let scale = 1;
        const inner = document.getElementById('diagramInner');
        const label = document.getElementById('zoomLabel');

        function zoom(delta) {
            scale = Math.max(0.3, Math.min(2, scale + delta));
            inner.style.transform = `scale(${scale})`;
            label.textContent = Math.round(scale * 100) + '%';
        }

        function resetZoom() {
            scale = 1;
            inner.style.transform = 'scale(1)';
            label.textContent = '100%';
        }

        function fitWidth() {
            const wrapper = document.querySelector('.diagram-wrapper');
            const svgWidth = 1060;
            scale = (wrapper.clientWidth - 64) / svgWidth;
            inner.style.transform = `scale(${scale})`;
            label.textContent = Math.round(scale * 100) + '%';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '=' || e.key === '+') zoom(0.1);
            if (e.key === '-') zoom(-0.1);
            if (e.key === '0') resetZoom();
        });
    </script>
</body>
</html>
